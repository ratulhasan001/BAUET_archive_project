{% if messages %}
<div class="container-page mt-6 space-y-3">
  {% for message in messages %}
  <div role="alert" class="flex items-start gap-3 rounded-xl border px-4 py-3 text-sm shadow-sm
    {% if message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-800
    {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800
    {% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800
    {% else %}border-indigo-200 bg-indigo-50 text-indigo-800{% endif %}">
    <p class="flex-1">{{ message }}</p>
    <button type="button" data-dismiss class="opacity-60 hover:opacity-100" aria-label="Dismiss">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
