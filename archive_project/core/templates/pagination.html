{% if page_obj.has_other_pages %}
<nav class="mt-10 flex items-center justify-between border-t border-slate-200 pt-6" aria-label="Pagination">
  {% if page_obj.has_previous %}
  <a href="?{% if query %}q={{ query|urlencode }}&category={{ category }}&{% endif %}page={{ page_obj.previous_page_number }}" class="btn-secondary">Previous</a>
  {% else %}<span></span>{% endif %}
  <p class="text-sm text-slate-500">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</p>
  {% if page_obj.has_next %}
  <a href="?{% if query %}q={{ query|urlencode }}&category={{ category }}&{% endif %}page={{ page_obj.next_page_number }}" class="btn-secondary">Next</a>
  {% else %}<span></span>{% endif %}
</nav>
{% endif %}
