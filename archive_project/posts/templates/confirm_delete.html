{% extends 'auth_base.html' %}
{% block head_title %}Delete post{% endblock %}
{% block card_title %}Delete this submission?{% endblock %}
{% block card_body %}
<p class="text-sm text-slate-600">
  <span class="font-semibold text-slate-900">“{{ post.title }}”</span> and its attached file will be permanently removed.
  This can't be undone.
</p>
<form method="post" class="mt-6 flex gap-3">
  {% csrf_token %}
  <a href="{{ post.get_absolute_url }}" class="btn-secondary flex-1">Cancel</a>
  <button type="submit" class="btn-danger flex-1">Delete</button>
</form>
{% endblock %}
