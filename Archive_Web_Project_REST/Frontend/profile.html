<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My profile · BAUET Project &amp; Thesis Archive</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4"></script>
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="app-header"></div>
    <main class="flex-1">
      <div class="container-page py-10">
        <section id="profile-card" class="card overflow-hidden">
          <div class="skeleton h-48 rounded-none"></div>
        </section>

        <section class="mt-10">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900">My submissions</h2>
            <span id="post-count" class="text-sm text-slate-500"></span>
          </div>
          <div id="my-posts" class="mt-5 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
        </section>

        <section id="edit-section" class="mt-10 hidden">
          <h2 class="text-xl font-bold text-slate-900">Edit profile</h2>
          <form id="profile-form" class="card mt-5 space-y-6 p-6 sm:p-8" novalidate>
            <p data-form-error class="hidden rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700"></p>
            <div class="grid gap-5 sm:grid-cols-2">
              <div data-field><label for="first_name" class="label">First name</label><input id="first_name" name="first_name" class="input" /></div>
              <div data-field><label for="last_name" class="label">Last name</label><input id="last_name" name="last_name" class="input" /></div>
              <div data-field>
                <label for="designation" class="label">Designation</label>
                <select id="designation" name="designation" class="input">
                  <option>Student</option>
                  <option>Lecturer</option>
                  <option>Assistant Professor</option>
                  <option>Associate Professor</option>
                  <option>Professor</option>
                </select>
              </div>
              <div data-field>
                <label for="dept" class="label">Department</label>
                <select id="dept" name="dept" class="input">
                  <option>Computer Science and Engineering</option>
                  <option>Electrical and Electronic Engineering</option>
                  <option>Information and Communication Engineering</option>
                  <option>Civil Engineering</option>
                  <option>Mechanical Engineering</option>
                  <option>Business Administration</option>
                </select>
              </div>
              <div data-field><label for="contact_number" class="label">Contact number</label><input id="contact_number" name="contact_number" class="input" maxlength="11" /></div>
              <div data-field><label for="address" class="label">Address</label><input id="address" name="address" class="input" maxlength="200" /></div>
            </div>
            <div data-field>
              <label for="image" class="label">Profile photo</label>
              <input id="image" name="image" type="file" accept="image/*" class="input" />
            </div>
            <div class="flex justify-end gap-3">
              <button type="button" data-cancel-edit class="btn btn-secondary">Cancel</button>
              <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <div id="app-footer"></div>
    <script type="module" src="js/pages/profile.js"></script>
  </body>
</html>
