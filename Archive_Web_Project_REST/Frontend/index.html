<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse · BAUET Project &amp; Thesis Archive</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4"></script>
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="app-header"></div>
    <main class="flex-1">
      <section class="border-b border-slate-200 bg-gradient-to-br from-indigo-600 via-indigo-700 to-slate-900 text-white">
        <div class="container-page py-12 sm:py-16">
          <p class="text-sm font-semibold uppercase tracking-wider text-indigo-200">BAUET Project &amp; Thesis Archive</p>
          <h1 id="hero-title" class="mt-2 max-w-3xl text-3xl font-bold tracking-tight sm:text-4xl">Discover research by BAUET students and faculty</h1>
          <p id="hero-subtitle" class="mt-3 max-w-2xl text-indigo-100">Browse approved projects and theses across every department.</p>
          <form id="search-form" class="mt-6 flex max-w-xl gap-2" role="search">
            <input type="search" name="search" placeholder="Search by title, abstract, student or supervisor" class="input border-white/20" aria-label="Search" />
            <button type="submit" class="btn bg-white text-indigo-700 hover:bg-indigo-50">Search</button>
          </form>
        </div>
      </section>

      <div class="container-page mt-10 grid gap-8 lg:grid-cols-[260px_1fr]">
        <aside>
          <div class="card p-4">
            <h2 class="px-3 pb-2 text-xs font-semibold uppercase tracking-wider text-slate-500">Departments</h2>
            <nav id="department-list" class="space-y-0.5">
              <div class="skeleton h-9"></div>
              <div class="skeleton mt-1 h-9"></div>
              <div class="skeleton mt-1 h-9"></div>
            </nav>
          </div>
        </aside>

        <section>
          <div id="result-summary" class="mb-4 hidden text-sm text-slate-500"></div>
          <div id="post-grid" class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3"></div>
          <nav id="pagination" class="mt-10 hidden items-center justify-between border-t border-slate-200 pt-6" aria-label="Pagination">
            <button type="button" data-page="prev" class="btn btn-secondary">Previous</button>
            <p data-page-label class="text-sm text-slate-500"></p>
            <button type="button" data-page="next" class="btn btn-secondary">Next</button>
          </nav>
        </section>
      </div>
    </main>
    <div id="app-footer"></div>
    <script type="module" src="js/pages/home.js"></script>
  </body>
</html>
