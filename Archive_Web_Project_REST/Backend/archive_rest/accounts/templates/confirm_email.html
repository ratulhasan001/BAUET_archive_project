<div style="font-family: Arial, sans-serif; color: #1e293b; max-width: 520px;">
  <h2 style="color: #4338ca;">Welcome to the BAUET Archive, {{ user.first_name|default:user.username }}!</h2>
  <p>Thanks for creating an account. Please confirm your email address to activate it.</p>
  <p>
    <a href="{{ confirm_link }}" style="display: inline-block; background: #4f46e5; color: #fff; padding: 10px 18px; border-radius: 8px; text-decoration: none;">Activate account</a>
  </p>
  <p style="font-size: 13px; color: #64748b;">Or paste this link into your browser:<br />{{ confirm_link }}</p>
</div>
